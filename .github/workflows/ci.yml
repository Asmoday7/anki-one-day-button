name: HoldUp checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Anki ${{ matrix.anki }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        anki: ["26.9", "26.9.3"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
      HOLDUP_GUI_TIMEOUT: "180"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ startsWith(matrix.os, 'windows') && '3.13' || '3.12' }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install the tested Anki version
        run: python -m pip install -r requirements-dev.txt "aqt[qt]==${{ matrix.anki }}"
      - name: Create validation output directory
        run: python -c "from pathlib import Path; Path('.dev').mkdir(exist_ok=True)"
      - name: Run backend and packaged desktop checks
        run: python -m pytest -q --basetemp=.dev/ci-tests --junitxml=.dev/ci-results.xml
      - name: Publish failure details in check annotations
        if: failure()
        run: python tools/report_ci_failure.py .dev/ci-results.xml
      - name: Require all integration checks
        run: python tools/check_test_report.py .dev/ci-results.xml
      - name: Measure a large synthetic queue
        run: python tools/benchmark_queue.py --count 1000 --output .dev/queue-benchmark.json
      - name: Verify tag and build the release package
        if: github.ref_type == 'tag'
        shell: bash
        run: python tools/build_release.py --tag "$GITHUB_REF_NAME"
      - name: Build the candidate package
        if: github.ref_type != 'tag'
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-anki-${{ matrix.anki }}
          include-hidden-files: true
          path: |
            .dev/ci-results.xml
            .dev/queue-benchmark.json
            .dev/ci-tests/**/desktop.log
            .dev/ci-tests/**/anki-profile/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-anki-${{ matrix.anki }}
          path: |
            dist/holdup-*.ankiaddon
            dist/holdup-*.zip
            dist/SHA256SUMS

  candidate:
    name: Publish release candidate
    needs: checks
    if: github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: .dev/validated-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: .dev/validated-reports
      - name: Build and compare all four validated installers
        shell: bash
        run: |
          python tools/build_release.py --tag "$GITHUB_REF_NAME"
          python - <<'PY'
          from pathlib import Path
          import json
          version = json.loads(Path('holdup/manifest.json').read_text())['human_version']
          for suffix in ('.ankiaddon', '.zip'):
              name = f'holdup-{version}{suffix}'
              expected = (Path('dist') / name).read_bytes()
              tested = list(Path('.dev/validated-packages').glob(f'*/{name}'))
              assert len(tested) == 4 and all(path.read_bytes() == expected for path in tested)
          PY
      - name: Record actual CI validation results
        shell: bash
        run: python tools/build_validation_record.py .dev/validated-reports "dist/validation-${GITHUB_REF_NAME#v}.json"
      - name: Publish the candidate and installation files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease \
            --title "HoldUp ${GITHUB_REF_NAME#v}" \
            --notes-file release/RELEASE_NOTES.md \
            dist/holdup-*.ankiaddon dist/holdup-*.zip dist/SHA256SUMS dist/validation-*.json
